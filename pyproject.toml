[project]
name = "fpl-optimiser"
version = "0.1.0"
description = "Local decision-support tool for Fantasy Premier League 2026/27"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "duckdb>=1.5",
    "typer>=0.15",
    "rich>=13",
    "polars>=1.20",
    "pyarrow>=18",
    "pytz",           # duckdb needs it to hand back TIMESTAMPTZ values
    "tzdata",         # Windows ships no system tz database
    "tenacity>=9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpl = "fpl.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpl = ["*.sql", "web/templates/*.html", "web/static/*.css", "web/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
